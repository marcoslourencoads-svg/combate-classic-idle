<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7e39a"/>
      <stop offset=".5" stop-color="#e8c14f"/>
      <stop offset="1" stop-color="#8a6b1f"/>
    </linearGradient>
    <linearGradient id="e" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7dffd4"/>
      <stop offset="1" stop-color="#0f9b70"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="12" fill="#0a0e1c"/>
  <!-- moldura em quatro cantos, a mesma linguagem da .rune-frame -->
  <g fill="url(#g)">
    <rect x="8"  y="8"  width="3" height="12"/><rect x="8"  y="8"  width="12" height="3"/>
    <rect x="53" y="8"  width="3" height="12"/><rect x="44" y="8"  width="12" height="3"/>
    <rect x="8"  y="44" width="3" height="12"/><rect x="8"  y="53" width="12" height="3"/>
    <rect x="53" y="44" width="3" height="12"/><rect x="44" y="53" width="12" height="3"/>
  </g>
  <!-- gema esmeralda central -->
  <rect x="22" y="22" width="20" height="20" rx="3" fill="url(#e)" transform="rotate(45 32 32)"/>
</svg>
